name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  sensitive-terms:
    name: sensitive-terms baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baseline sensitive-terms scan
        run: |
          # CI only enforces the committed baseline (the private denylist is
          # never available in CI by design). This catches real GUIDs etc.
          bash scripts/check-sensitive.sh || true
          if grep -rEIn 'subscription_id[[:space:]]*=[[:space:]]*"[0-9a-f]{8}-' \
             --include='*.tf' --include='*.tfvars' \
             --exclude='*.example' . ; then
            echo "::error::Hard-coded subscription_id found outside an example file."
            exit 1
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1a2b" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="foundryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6cbd"/><stop offset="1" stop-color="#117865"/>
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#117865"/><stop offset="1" stop-color="#35a88b"/>
    </linearGradient>
    <linearGradient id="answerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf5f2"/><stop offset="1" stop-color="#f4f8fc"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f6cbd"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#117865"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b77900"/></marker>
    <g id="foundryIqMark">
      <circle cx="0" cy="0" r="33" fill="#f4f0ff" stroke="#8b6ce7" stroke-width="2"/>
      <g fill="#7054d8">
        <rect x="-5" y="-25" width="10" height="22" rx="5"/>
        <rect x="-5" y="3" width="10" height="22" rx="5"/>
        <rect x="-25" y="-5" width="22" height="10" rx="5"/>
        <rect x="3" y="-5" width="22" height="10" rx="5"/>
        <rect x="-5" y="-25" width="10" height="22" rx="5" transform="rotate(45)"/>
        <rect x="-5" y="3" width="10" height="22" rx="5" transform="rotate(45)"/>
        <rect x="-5" y="-25" width="10" height="22" rx="5" transform="rotate(-45)"/>
        <rect x="-5" y="3" width="10" height="22" rx="5" transform="rotate(-45)"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
      <circle cx="18" cy="18" r="6" fill="#23b7d1" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g id="fabricIqMark">
      <circle cx="0" cy="0" r="33" fill="#e8fbf6" stroke="#35a88b" stroke-width="2"/>
      <rect x="-20" y="7" width="9" height="15" rx="3" fill="#117865"/>
      <rect x="-7" y="-2" width="9" height="24" rx="3" fill="#15977f"/>
      <rect x="6" y="-12" width="9" height="34" rx="3" fill="#23b7a0"/>
      <path d="M-21-9C-8-21 7-21 21-10" fill="none" stroke="#0f6cbd" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-21" cy="-9" r="4" fill="#0f6cbd"/><circle cx="21" cy="-10" r="4" fill="#0f6cbd"/>
    </g>
    <g id="dataAgentMark">
      <circle cx="0" cy="0" r="32" fill="#117865"/>
      <rect x="-21" y="-13" width="42" height="31" rx="13" fill="#ffffff"/>
      <circle cx="-9" cy="2" r="4" fill="#117865"/><circle cx="9" cy="2" r="4" fill="#117865"/>
      <path d="M-10 11c6 5 14 5 20 0" fill="none" stroke="#117865" stroke-width="3" stroke-linecap="round"/>
      <path d="M0-13v-9" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-25" r="4" fill="#23b7d1" stroke="#ffffff" stroke-width="2"/>

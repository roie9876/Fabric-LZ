  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="62" y="46" font-size="13" font-weight="700" letter-spacing="1.5" fill="#117865">FOUNDRY IQ + FABRIC IQ  /  SECURE TARGET ARCHITECTURE</text>
  <text x="60" y="93" font-size="38" font-weight="750" fill="#20242b">Foundry IQ meets Fabric IQ</text>
  <text x="62" y="128" font-size="18" font-weight="550" fill="#5b5f66">Ask enterprise questions through one governed agent — private networking, user identity passthrough, and Fabric-native semantics</text>
  <rect x="1260" y="40" width="276" height="42" rx="10" fill="#fff4ce" stroke="#d9be69" stroke-width="1.5"/>
  <text x="1398" y="66" text-anchor="middle" font-size="12" font-weight="750" fill="#735c20">TARGET INTEGRATION · IMPLEMENTATION PENDING</text>

  <!-- Shared secure foundation -->
  <rect x="48" y="160" width="1504" height="650" rx="26" fill="#f7f9fb" stroke="#e1e7ed" stroke-width="1.5"/>
  <text x="76" y="193" font-size="13" font-weight="750" letter-spacing="1" fill="#5b5f66">SAME-TENANT PRIVATE INTEGRATION BOUNDARY</text>

  <!-- User / channel -->
  <rect x="78" y="242" width="260" height="430" rx="22" fill="#ffffff" stroke="#b9c0c8" stroke-width="1.5" filter="url(#soft)"/>
  <text x="208" y="280" text-anchor="middle" font-size="14" font-weight="750" fill="#30343b">PRIVATE EXPERIENCE</text>
  <circle cx="208" cy="361" r="43" fill="#0f6cbd"/>
  <circle cx="208" cy="348" r="14" fill="#ffffff"/>
  <path d="M181 386a27 24 0 0 1 54 0z" fill="#ffffff"/>
  <circle cx="248" cy="329" r="16" fill="#ffffff" stroke="#8fb5d9" stroke-width="2"/>
  <text x="248" y="336" text-anchor="middle" font-size="20" font-weight="800" fill="#0f6cbd">?</text>
  <text x="208" y="426" text-anchor="middle" font-size="19" font-weight="750" fill="#20242b">User / application</text>
  <text x="208" y="453" text-anchor="middle" font-size="13" font-weight="550" fill="#5b5f66">Private network client</text>
  <rect x="108" y="493" width="200" height="66" rx="12" fill="#f4f8fc" stroke="#8fb5d9" stroke-width="1.3"/>
  <text x="208" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#254a68">APIM private endpoint</text>
  <text x="208" y="542" text-anchor="middle" font-size="12" fill="#5b5f66">Authentication · rate limits · audit</text>
  <rect x="108" y="584" width="200" height="50" rx="10" fill="#eaf5f2" stroke="#b9ddd5" stroke-width="1.2"/>
  <text x="208" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#117865">Signed-in Entra identity</text>
  <text x="208" y="623" text-anchor="middle" font-size="11" fill="#5b5f66">No embedded user credential</text>

  <!-- Foundry IQ -->
  <rect x="396" y="226" width="410" height="462" rx="24" fill="#f4f8fc" stroke="#6c9dcc" stroke-width="2" filter="url(#soft)"/>
  <rect x="396" y="226" width="410" height="72" rx="24" fill="url(#foundryGrad)"/>
  <rect x="396" y="274" width="410" height="24" fill="url(#foundryGrad)"/>
  <text x="426" y="258" font-size="24" font-weight="750" fill="#ffffff">Foundry IQ</text>
  <text x="426" y="282" font-size="12.5" font-weight="600" fill="#dff4ee">Private orchestration and reasoning</text>
  <g transform="translate(464 365)"><use href="#foundryIqMark"/></g>
  <g transform="translate(758 260) scale(.55)"><use href="#foundryIqMark"/></g>
  <text x="526" y="351" font-size="18" font-weight="750" fill="#20242b">Foundry agent</text>
  <text x="526" y="376" font-size="13" fill="#5b5f66">Intent routing · response synthesis</text>
  <text x="526" y="397" font-size="13" fill="#5b5f66">Model orchestration · citations</text>

  <rect x="430" y="438" width="342" height="82" rx="14" fill="#ffffff" stroke="#8fb5d9" stroke-width="1.4"/>
  <text x="451" y="465" font-size="14" font-weight="750" fill="#0f6cbd">Microsoft Fabric tool</text>
  <text x="451" y="489" font-size="12.5" fill="#5b5f66">Foundry project connection → published data agent</text>
  <text x="451" y="509" font-size="12.5" fill="#5b5f66">User identity passthrough (On-Behalf-Of)</text>

  <rect x="430" y="548" width="342" height="104" rx="14" fill="#ffffff" stroke="#d9dee4" stroke-width="1.3"/>
  <text x="451" y="576" font-size="13" font-weight="750" fill="#30343b">Private agent foundation</text>
  <text x="451" y="599" font-size="12" fill="#5b5f66">Runtime managed identity · private DNS · private endpoints</text>
  <text x="451" y="620" font-size="12" fill="#5b5f66">gpt-5-mini · Search · Storage · Cosmos DB · ACR</text>
  <text x="451" y="641" font-size="12" fill="#5b5f66">OpenTelemetry → Application Insights through AMPLS</text>

  <!-- Fabric IQ -->
  <rect x="858" y="226" width="650" height="462" rx="24" fill="#f2faf7" stroke="#72ad9d" stroke-width="2" filter="url(#soft)"/>
  <rect x="858" y="226" width="650" height="72" rx="24" fill="url(#fabricGrad)"/>
  <rect x="858" y="274" width="650" height="24" fill="url(#fabricGrad)"/>
  <text x="888" y="258" font-size="24" font-weight="750" fill="#ffffff">Fabric IQ</text>
  <text x="888" y="282" font-size="12.5" font-weight="600" fill="#e8fff8">Governed conversational analytics over enterprise data</text>
  <g transform="translate(1464 260) scale(.55)"><use href="#fabricIqMark"/></g>

  <rect x="890" y="328" width="586" height="116" rx="16" fill="#ffffff" stroke="#72ad9d" stroke-width="1.4"/>
  <g transform="translate(946 386)"><use href="#dataAgentMark"/></g>
  <text x="1000" y="367" font-size="18" font-weight="750" fill="#20242b">Published Fabric data agent</text>
  <text x="1000" y="391" font-size="13" fill="#5b5f66">Read-only question planning and query execution</text>
  <text x="1000" y="413" font-size="13" fill="#5b5f66">NL2SQL · governed source selection · concise result</text>

  <text x="890" y="484" font-size="13" font-weight="750" letter-spacing="0.7" fill="#117865">PRIVATE WORKSPACE A · PUBLIC ACCESS DISABLED</text>
  <rect x="890" y="500" width="176" height="122" rx="14" fill="#ffffff" stroke="#b9ddd5" stroke-width="1.3"/>
  <path d="M930 532c0-12 16-21 36-21s36 9 36 21v47c0 12-16 21-36 21s-36-9-36-21z" fill="#eef4fb" stroke="#0f6cbd" stroke-width="2"/>

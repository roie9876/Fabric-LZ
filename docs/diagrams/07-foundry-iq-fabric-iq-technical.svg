  <text x="978" y="602" text-anchor="middle" font-size="12.5" font-weight="750" fill="#20242b">Lakehouse tables</text>
  <text x="978" y="618" text-anchor="middle" font-size="10.5" fill="#5b5f66">OneLake · SQL endpoint</text>

  <rect x="1080" y="500" width="176" height="122" rx="14" fill="#ffffff" stroke="#b9ddd5" stroke-width="1.3"/>
  <rect x="1121" y="519" width="92" height="68" rx="10" fill="#eef4fb" stroke="#0f6cbd" stroke-width="2"/>
  <path d="M1137 537h60M1137 553h60M1137 569h40" stroke="#0f6cbd" stroke-width="3" stroke-linecap="round"/>
  <text x="1168" y="603" text-anchor="middle" font-size="13" font-weight="750" fill="#20242b">Warehouse / SQL</text>

  <rect x="1270" y="500" width="206" height="122" rx="14" fill="#fff9e9" stroke="#d9be69" stroke-width="1.3"/>
  <path d="M1312 529l22-12 22 12v26c0 17-10 31-22 38-12-7-22-21-22-38z" fill="#b77900" opacity="0.9"/>
  <path d="M1324 551l8 8 15-18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1366" y="538" font-size="11.5" font-weight="750" fill="#735c20">OBO user authorization</text>
  <text x="1366" y="558" font-size="10.5" fill="#5b5f66">Fabric permissions · RLS / CLS</text>
  <text x="1366" y="576" font-size="10.5" fill="#5b5f66">Purview · read-only</text>
  <text x="1366" y="594" font-size="10.5" fill="#5b5f66">Same-tenant boundary</text>

  <!-- Request / response flows -->
  <path d="M338 430H396" fill="none" stroke="#0f6cbd" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#arrowBlue)"/>
  <rect x="331" y="390" width="86" height="27" rx="7" fill="#ffffff"/>
  <text x="374" y="408" text-anchor="middle" font-size="11.5" font-weight="750" fill="#0f6cbd">PRIVATE API</text>

  <path d="M806 470H858" fill="none" stroke="#0f6cbd" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#arrowBlue)"/>
  <rect x="774" y="411" width="116" height="46" rx="9" fill="#ffffff" stroke="#c7d6ea"/>
  <text x="832" y="430" text-anchor="middle" font-size="11.5" font-weight="750" fill="#0f6cbd">FABRIC TOOL</text>
  <text x="832" y="447" text-anchor="middle" font-size="10.5" fill="#5b5f66">OBO user identity</text>

  <path d="M1150 444V500" fill="none" stroke="#117865" stroke-width="3" marker-end="url(#arrowTeal)"/>

  <path d="M858 650H806" fill="none" stroke="#117865" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#arrowTeal)"/>
  <rect x="775" y="614" width="115" height="27" rx="7" fill="#ffffff"/>
  <text x="832" y="632" text-anchor="middle" font-size="11" font-weight="750" fill="#117865">GOVERNED RESULT</text>

  <path d="M396 650H338" fill="none" stroke="#117865" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#arrowTeal)"/>
  <rect x="328" y="614" width="97" height="27" rx="7" fill="#ffffff"/>
  <text x="377" y="632" text-anchor="middle" font-size="11" font-weight="750" fill="#117865">CITED ANSWER</text>

  <!-- Security rail -->
  <rect x="78" y="738" width="1430" height="48" rx="12" fill="url(#answerGrad)" stroke="#b9ddd5" stroke-width="1.3"/>
  <text x="793" y="768" text-anchor="middle" font-size="13" font-weight="750" fill="#117865">PRIVATE LINK + MICROSOFT BACKBONE  ·  ENTRA OBO  ·  LEAST PRIVILEGE  ·  PURVIEW / RLS / CLS  ·  FIREWALL + PRIVATE DNS  ·  AMPLS AUDIT</text>

  <text x="800" y="850" text-anchor="middle" font-size="12" fill="#7a7f85">Private-link scope for the first implementation: Fabric data agent over Lakehouse / Warehouse / SQL sources. Preview tool and network behavior must be validated in the target tenant and region.</text>
</svg>
